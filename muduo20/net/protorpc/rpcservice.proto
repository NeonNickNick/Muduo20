syntax = "proto2";

package muduo20.net;

option cc_generic_services = true;
option java_generic_services = true;
option py_generic_services = true;

option java_package = "com.chenshuo.muduo20.protorpc";
option java_outer_classname = "RpcServiceProto";

import "rpc.proto";

message ListRpcRequest {
  optional std::string service_name = 1;
  optional bool list_method = 2;
}

message ListRpcResponse {
  required ErrorCode error = 1;
  repeated std::string service_name = 2;
  repeated std::string method_name = 3;
}

message GetServiceRequest {
  required std::string service_name = 1;
}

message GetServiceResponse {
  required ErrorCode error = 1;
  repeated std::string proto_file = 2;
  repeated std::string proto_file_name = 3;
}

service RpcService {
  rpc listRpc(ListRpcRequest) returns (ListRpcResponse);
  rpc getService(GetServiceRequest) returns (GetServiceResponse);
}
